name: プラグインのリリース
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none
      - name: 依存関係をインストール
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: コーディング規約を確認
        run: composer lint
      - name: バージョンを照合して配布 ZIP を作成
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package.py "$RELEASE_TAG"
      - name: ZIP を添付してリリースを公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/od-block-css-indicator.zip --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
